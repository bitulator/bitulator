<script>
// Part 20 (JS18): navigation moves into the cards (companion to Part 19).
// - Top bar keeps ONLY the glance strip (buttons and the ₿ mark are hidden)
// - Jump-to panel (grid, filter, message, hint, reset row) and the old Tiles
//   switch row are hidden
// - The header's label row keeps just the Light/Dark toggle + a "Manage cards"
//   button. Manage mode: tiles show their handle row (drag, up/down, info,
//   share) and an X badge to hide/restore a card (same localStorage 'bhd'
//   store Part 17 uses); the Reset layout button appears in manage mode.
(function(){
"use strict";
var css=[
"#bstk .bstk-row,#bstk .bstk-m{display:none!important}",
"#bsats .hdr .jmsg,#bsats .hdr .jfilter,#bsats .hdr .jnomatch,#bsats .hdr .navgrid,#bsats .hdr .jrrow{display:none!important}",
"#bsats .hdr .note{display:none!important}",
"#bsats .trow{display:none!important}",
"#bsats .hdr .jlab{font-size:0;display:flex;justify-content:flex-end;align-items:center;gap:8px}",
"#bsats .hdr .jlab .jshow,#bsats .hdr .jlab .jnote{display:none!important}",
"#bsats .hdr .jlab button{font-size:13px}",
"#bsats #xmanbtn{background:#26334d;color:#e2e8f0;border:1px solid #3b4a68;border-radius:8px;padding:5px 10px;cursor:pointer}",
"body.blite #bsats #xmanbtn{background:#e2e8f0;color:#0f172a;border-color:#cbd5e1}",
"body.xman #bsats #xmanbtn{background:#fde047;color:#0b0f17;border-color:#fde047}",
"#bsats .card{position:relative}",
"body.xman #bsats .card:not(.xopen) .hd{display:flex!important}",
"#bsats .card{min-width:0}",
"body.xman #bsats .card .hd{flex-wrap:wrap;row-gap:4px}",
"body.xman #bsats .card:not(.xopen) .hd button{padding:5px 8px;font-size:12px}",
"#bsats .xhx{display:none;position:absolute;top:6px;right:6px;z-index:5;width:22px;height:22px;border-radius:50%;background:#26334d;color:#fde047;border:1px solid #f59e0b;font-size:13px;line-height:1;cursor:pointer;text-align:center;padding:0}",
"body.xman #bsats .xhx{display:block}",
"#bsats .card.xgost{opacity:.38;outline:1.5px dashed #f59e0b;outline-offset:-1.5px}",
"#brs{display:none!important}",
"body.xman #brs{display:inline-block!important}"
].join("\n");
var st=document.createElement("style");st.textContent=css;document.head.appendChild(st);
var SIGS=["bp","bch","bhw","bda","bno","bgo","bmyo","bwi","bga","bfa","bmto","bsuo","bdio","bhra","bbbo","breso","bhp","byt","blk","bln","blu","bep","bml","bfe"];
var root=document.getElementById("bsats");if(!root)return;
var cards=[].slice.call(root.querySelectorAll(".card"));
function sigOf(c){for(var i=0;i<SIGS.length;i++){if(c.querySelector("#"+SIGS[i]))return SIGS[i];}return null;}
function getBhd(){try{var v=JSON.parse(localStorage.getItem("bhd")||"[]");return Array.isArray(v)?v:[];}catch(e){return[];}}
function setBhd(a){try{localStorage.setItem("bhd",JSON.stringify(a));}catch(e){}}
var jlab=root.querySelector(".hdr .jlab");
var mbtn=document.createElement("button");mbtn.type="button";mbtn.id="xmanbtn";mbtn.textContent="Manage cards";
if(jlab)jlab.appendChild(mbtn);
cards.forEach(function(c){
  var x=document.createElement("button");x.type="button";x.className="xhx";x.textContent="✕";x.title="Hide / restore this card";
  x.addEventListener("click",function(e){
    e.stopPropagation();
    var sig=sigOf(c);if(!sig)return;
    var bhd=getBhd();
    if(c.classList.contains("xgost")){c.classList.remove("xgost");setBhd(bhd.filter(function(s){return s!==sig;}));}
    else{c.classList.add("xgost");if(bhd.indexOf(sig)<0)bhd.push(sig);setBhd(bhd);}
  });
  c.appendChild(x);
});
function enterManage(){
  document.body.classList.add("xman");
  mbtn.textContent="Done managing";
  var bhd=getBhd();
  cards.forEach(function(c){
    var sig=sigOf(c);
    if(sig&&bhd.indexOf(sig)>=0){c.style.display="";c.classList.add("xgost");}
  });
}
function exitManage(){
  document.body.classList.remove("xman");
  mbtn.textContent="Manage cards";
  cards.forEach(function(c){if(c.classList.contains("xgost"))c.style.display="none";});
}
mbtn.addEventListener("click",function(){
  if(document.body.classList.contains("xman"))exitManage();else enterManage();
});
// let Part 10's fit() re-measure the slimmer top bar
[150,600,1500].forEach(function(t){setTimeout(function(){window.dispatchEvent(new Event("resize"));},t);});
})();
</script>
