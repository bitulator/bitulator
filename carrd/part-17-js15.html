<script>
(function(){
var pa=document.getElementById('bsats');if(!pa)return;
var st=document.createElement('style');st.textContent='#bsats .navgrid [data-j]{position:relative}#bsats .navgrid .hbx{position:absolute;top:-7px;right:-7px;width:16px;height:16px;line-height:15px;text-align:center;font-size:11px;border-radius:50%;background:#26334d;color:#fde047;border:1px solid #fde047;cursor:pointer;z-index:6}#bsats .navgrid [data-j].hdim{opacity:.42;outline:1px dashed #94a3b8;outline-offset:-1px}#bsats .hdr.jclosed .navgrid{display:none}#bsats .hdr.jclosed p.note{display:none}#bsats .hdr.jclosed .jmsg{display:none}#bsats .jmsg{color:#94a3b8;font-size:12.5px;margin:8px 0 2px}#bsats .jrst{float:right}#bsats .jnote{color:#94a3b8;font-size:11.5px;margin-left:8px}#bsats .jtog{margin-left:10px;background:transparent!important;color:#94a3b8!important;border:1px solid #334155!important;border-radius:7px!important;padding:2px 9px!important;font-size:11.5px!important;font-weight:700!important;cursor:pointer;vertical-align:middle}';document.head.appendChild(st);
var IDS=['bp','bch','bhw','bda','bno','bgo','bmyo','bwi','bga','bfa','bmto','bsuo','bdio','bhra','bbbo','breso','bhp','byt','blk','bln','blu','bep','bml','bfe'];
function cardOf(id){var e=document.getElementById(id);return e?e.closest('.card'):null}
var grid=pa.querySelector('.navgrid');
function gbtn(id){return grid?grid.querySelector('[data-j="'+id+'"]'):null}
var hidden=[];try{hidden=JSON.parse(localStorage.getItem('bhd')||'[]')}catch(e){hidden=[]}
if(!Array.isArray(hidden))hidden=[];hidden=hidden.filter(function(id){return IDS.indexOf(id)>=0});
function save(){try{localStorage.setItem('bhd',JSON.stringify(hidden))}catch(e){}}
function apply(id){var c=cardOf(id),hid=hidden.indexOf(id)>=0;if(c)c.style.display=hid?'none':'';document.querySelectorAll('#bstk [data-j="'+id+'"]').forEach(function(b){b.style.display=hid?'none':''});var g=gbtn(id);if(g)g.classList.toggle('hdim',hid)}
function hide(id){if(hidden.indexOf(id)<0)hidden.push(id);apply(id);save()}
function show(id){hidden=hidden.filter(function(x){return x!==id});apply(id);save()}
function unhideAll(){hidden=[];IDS.forEach(function(id){apply(id)});save()}
hidden.forEach(function(id){apply(id)});
var brs=document.getElementById('brs');
if(brs)brs.addEventListener('click',unhideAll);
if(grid){
 grid.querySelectorAll('[data-j]').forEach(function(b){var x=document.createElement('span');x.className='hbx';x.textContent='✕';b.appendChild(x)});
 var lastDragEnd=0;
 grid.addEventListener('pointerdown',function(e){var sx=e.clientX,sy=e.clientY,moved=false;function mv(ev){if(Math.abs(ev.clientX-sx)>9||Math.abs(ev.clientY-sy)>9)moved=true}function up(){if(moved)lastDragEnd=Date.now();document.removeEventListener('pointermove',mv);document.removeEventListener('pointerup',up);document.removeEventListener('pointercancel',up)}document.addEventListener('pointermove',mv);document.addEventListener('pointerup',up);document.addEventListener('pointercancel',up)},true);
 grid.addEventListener('click',function(e){
  if(Date.now()-lastDragEnd<200)return;
  var b=e.target.closest?e.target.closest('[data-j]'):null;if(!b||!grid.contains(b))return;
  var id=b.getAttribute('data-j');
  if(e.target.classList&&e.target.classList.contains('hbx')){e.stopPropagation();e.preventDefault();hide(id);return}
  if(b.classList.contains('hdim')){e.stopPropagation();e.preventDefault();show(id)}
 },true);
 var hdr=pa.querySelector('.hdr');
 var msg=document.createElement('p');msg.className='jmsg';msg.textContent='You can hide individual cards from showing: tap a button\u2019s \u2715 to hide one \u2014 tap a dimmed button to bring it back.';grid.parentNode.insertBefore(msg,grid);
 var jlab=pa.querySelector('.jlab');
 if(hdr&&jlab){
  var tg=document.createElement('button');tg.type='button';tg.className='jtog';
  var sn=document.createElement('span');sn.className='jnote';
  function paint(){var cl=hdr.classList.contains('jclosed');tg.textContent=cl?'\u25B8 Show':'\u25BE Hide';sn.textContent=cl?'Reveal to rearrange the cards':''}
  var jc=true;try{jc=localStorage.getItem('bjc')!=='0'}catch(e){}
  if(jc)hdr.classList.add('jclosed');paint();
  tg.addEventListener('click',function(){hdr.classList.toggle('jclosed');try{localStorage.setItem('bjc',hdr.classList.contains('jclosed')?'1':'0')}catch(e){}paint()});
  jlab.appendChild(tg);jlab.appendChild(sn);
  var rb=document.createElement('button');rb.type='button';rb.className='jtog jrst';rb.textContent='Reset layout';rb.title='Reset card order and unhide all cards';
  rb.addEventListener('click',function(){unhideAll();if(brs)brs.click()});
  jlab.appendChild(rb);
 }
}
})();
</script>
