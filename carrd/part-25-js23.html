<script>
(function(){function fresh(el){if(!el)return null;var c=el.cloneNode(true);el.parentNode.replaceChild(c,el);return c}function top(){window.scrollTo({top:0,behavior:"smooth"})}function pg(d){window.scrollBy({top:d*window.innerHeight,behavior:"smooth"})}var u=fresh(document.getElementById("jup"));if(u){u.setAttribute("aria-label","Page up");u.addEventListener("click",function(){pg(-1)})}var d=fresh(document.getElementById("jdn"));if(d){d.setAttribute("aria-label","Page down");d.addEventListener("click",function(){pg(1)})}var t=fresh(document.getElementById("btop"));if(t)t.addEventListener("click",top);var pill=document.createElement("button");pill.type="button";pill.textContent="↑ Top";pill.setAttribute("aria-label","Back to top");pill.style.cssText="position:fixed;right:14px;bottom:118px;z-index:9998;background:#26334d;color:#fde047;border:1px solid #fde047;border-radius:999px;padding:9px 16px;font-size:14px;font-weight:900;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .25s;box-shadow:0 4px 14px rgba(0,0,0,.45)";pill.addEventListener("click",top);document.body.appendChild(pill);function chk(){var max=document.documentElement.scrollHeight-window.innerHeight;var near=max>0&&(window.scrollY||0)>=max-400;pill.style.opacity=near?"0.95":"0";pill.style.pointerEvents=near?"auto":"none"}window.addEventListener("scroll",chk,{passive:true});window.addEventListener("resize",chk);chk()})();
</script>
