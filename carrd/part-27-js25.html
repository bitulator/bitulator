<script>
/* card grouping (default view) */
(function(){
var SIG=["bp","bch","bhw","bda","bno","bgo","bmyo","bwi","bga","bfa","bmto","bsuo","bdio","bhra","bbbo","breso","bhp","byt","blk","bln","blu","bep","bml","bfe","","","bnw","bse","bmc"];
var G=[["Calculators & planning",[0,3,8,9,16,7,13,23]],["Price & market",[1,2,28,6,10,5,14]],["Network & Lightning",[4,18,12,21,11,20,19]],["News",[26,27]],["Watch & learn",[17,22,15]]];
var done=false;
function sync(){
document.querySelectorAll("#bsats .grph").forEach(function(h){
var name=h.getAttribute("data-grp"),any=false;
document.querySelectorAll('#bsats > .card[data-grp="'+name+'"]').forEach(function(c){if(c.style.display!=="none")any=true});
h.style.display=any?"":"none"});
}
function apply(){
if(done)return true;
var host=document.getElementById("bsats");if(!host)return false;
var cards=host.querySelectorAll(":scope >.card");
if(cards.length<27)return false;
done=true;
var DEF=[0,1,4,23,18,12,21,19,11,2,20,3,5,6,7,8,9,10,13,14,16,22,17,26,27,28,15];
var seq=[];
for(var i=0;i<cards.length;i++){var hit=-1;for(var j=0;j<SIG.length;j++){if(SIG[j]&&cards[i].querySelector("#"+SIG[j])){hit=j;break}}seq.push(hit)}
if(JSON.stringify(seq)!==JSON.stringify(DEF))return true;
var st=document.createElement("style");
st.textContent="#bsats .grph{box-sizing:border-box;margin:16px 0 4px;padding:9px 14px;background:#0f172a;border:1px solid #334155;border-left:5px solid #f59e0b;border-radius:10px;color:#fde047;font-weight:800;font-size:17px;scroll-margin-top:64px}body.blite #bsats .grph{background:#fff7ed;border-color:#d6a419;color:#92600a}";
document.head.appendChild(st);
var marker=document.createElement("div");host.insertBefore(marker,cards[0]);
G.forEach(function(g){
var hdr=document.createElement("div");hdr.className="grph";hdr.setAttribute("data-grp",g[0]);hdr.textContent=g[0];host.insertBefore(hdr,marker);
g[1].forEach(function(si){var el=document.getElementById(SIG[si]);var c=el?el.closest(".card"):null;if(c&&c.parentElement===host){host.insertBefore(c,marker);c.setAttribute("data-grp",g[0])}});
});
marker.remove();
sync();
document.addEventListener("click",function(){setTimeout(sync,50)});
setInterval(sync,2000);
return true;
}
var n=0;var iv=setInterval(function(){n++;if(apply()||n>40)clearInterval(iv)},250);
})();
</script>
