<script>
/* channel blurb hover popups v4 */
(function(){var tip=null,hoverOK=window.matchMedia&&matchMedia("(hover: hover) and (pointer: fine)").matches;
function ensureTip(){if(tip)return;var st=document.createElement("style");st.textContent="#byttip{position:fixed;z-index:9999;max-width:300px;background:#0f172a;border:1px solid #334155;color:#e2e8f0;border-radius:10px;padding:8px 12px;font-size:13px;line-height:1.45;pointer-events:none;opacity:0;transition:opacity .15s}body.blite #byttip{background:#fff;border-color:#cbd5e1;color:#1e293b}";document.head.appendChild(st);tip=document.createElement("div");tip.id="byttip";document.body.appendChild(tip)}
function show(b){ensureTip();tip.textContent=b.getAttribute("data-htip")||"";var r=b.getBoundingClientRect();tip.style.opacity="0";tip.style.left="0px";tip.style.top="0px";var w=tip.offsetWidth,h=tip.offsetHeight;var x=Math.min(Math.max(8,r.left+r.width/2-w/2),window.innerWidth-w-8);var y=r.top-h-8;if(y<8)y=r.bottom+8;tip.style.left=x+"px";tip.style.top=y+"px";tip.style.opacity="1"}
function hide(){if(tip)tip.style.opacity="0"}
function desc(el,name){var t="";for(var i=0;i<el.childNodes.length;i++){var n=el.childNodes[i];if(n.nodeType===1&&n.tagName==="A")continue;t+=n.textContent||""}t=t.trim();if(t.indexOf(name)===0)t=t.slice(name.length);return t.replace(/^\s*[—-]?\s*/,"")}
var passes=0,stable=0,lastCount=-1;
function apply(){var row=document.getElementById("bytrow");var card=document.getElementById("byt");if(!row||!card)return false;var wrap=card.closest(".card")||card;var btns=[].slice.call(row.querySelectorAll(".ytb"));var blurbs=[].slice.call(wrap.querySelectorAll("p.res"));blurbs.forEach(function(p){p.style.display="none"});
var real=blurbs.filter(function(p){return !p.closest(".xmin")});
btns.forEach(function(b,bi){if(b.getAttribute("data-htip"))return;var name=b.textContent.trim();var found=(real.length===btns.length)?real[bi]:null;if(!found)return;b.setAttribute("data-htip",desc(found,name));if(hoverOK){b.addEventListener("mouseenter",function(){show(b)});b.addEventListener("mouseleave",hide)}b.addEventListener("focus",function(){show(b)});b.addEventListener("blur",hide)});
var bound=btns.filter(function(b){return b.getAttribute("data-htip")}).length;
if(btns.length&&bound===btns.length&&btns.length===lastCount){stable++}else{stable=0}
lastCount=btns.length;
return stable>=8}
var iv=setInterval(function(){passes++;if(apply()||passes>60)clearInterval(iv)},250);apply()})();
</script>
