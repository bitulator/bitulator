<script>(()=>{const t=e=>document.getElementById(e),SY={USD:"$",EUR:"€",GBP:"£",JPY:"¥",CAD:"$",AUD:"$",CHF:"CHF ",CNY:"¥",INR:"₹",BRL:"R$",MXN:"$",KRW:"₩",SGD:"$",HKD:"$",NZD:"$",SEK:"kr ",NOK:"kr ",DKK:"kr ",PLN:"zł ",TRY:"₺",ZAR:"R"},cur=()=>{const s=t("bc");return s&&SY[s.value]?s.value:"USD"},dec=()=>("JPY"===cur()||"KRW"===cur())?0:2,v=(n,d)=>isFinite(n)?n.toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d}):"—",mon=n=>SY[cur()]+v(n,dec()),MO="Jan Feb Mar Apr May Jun Jul Aug Sep Oct Nov Dec".split(" ");
async function y(u,tx){const c=new AbortController(),to=setTimeout(()=>c.abort(),12e3);try{const r=await fetch(u,{signal:c.signal});if(!r.ok)throw 0;return tx?await r.text():await r.json()}finally{clearTimeout(to)}}const S=fs=>fs.reduce((p,f)=>p.catch(f),Promise.reject(0));
const nowP=()=>S([()=>y("https://api.coinbase.com/v2/prices/BTC-USD/spot").then(d=>{const p=parseFloat(d.data.amount);if(!(p>0))throw 0;return p}),()=>y("https://mempool.space/api/v1/prices").then(d=>{if(!(d.USD>0))throw 0;return d.USD}),()=>y("https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=usd").then(d=>d.bitcoin.usd)]);
let PC=null,PT=0;function curP(){if(PC&&Date.now()-PT<3e4)return Promise.resolve(PC);const c=cur(),pr=c==="USD"?nowP():S([()=>y("https://api.coinbase.com/v2/prices/BTC-"+c+"/spot").then(d=>{const p=parseFloat(d.data.amount);if(!(p>0))throw 0;return p}),()=>y("https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies="+c.toLowerCase()).then(d=>{const p=d.bitcoin[c.toLowerCase()];if(!(p>0))throw 0;return p})]);return pr.then(p=>{PC=p;PT=Date.now();return p})}
async function mt(){try{const p=await curP();if(!(p>0))throw 0;const sats=Math.round(1e8/p);let clock="",athH="";if(sats<1e4)clock='<div class="stat">Moscow Time<b>'+String(Math.floor(sats/100)).padStart(2,"0")+":"+String(sats%100).padStart(2,"0")+'</b></div>';try{const lc=cur().toLowerCase(),d=await y("https://api.coingecko.com/api/v3/coins/bitcoin?localization=false&tickers=false&market_data=true&community_data=false&developer_data=false&sparkline=false"),md=d.market_data,ath=md.ath[lc],adt=md.ath_date[lc]||"";if(ath>0)athH='<div class="stat">Lowest ever<b>'+v(Math.round(1e8/ath),0)+' sats</b></div><p class="note">At the all-time high of '+mon(ath)+(adt?' on '+MO[new Date(adt).getMonth()]+' '+new Date(adt).getDate()+', '+new Date(adt).getFullYear():'')+', '+SY[cur()]+'1 bought the fewest sats ever. CoinGecko.</p>'}catch(e){}
t("bmto").innerHTML='<div class="grid"><div class="stat">Sats per '+SY[cur()]+'1<b>'+v(sats,0)+'</b></div>'+clock+'</div>'+athH+'<p class="note">How many sats one '+cur()+' buys right now. The lower it goes, the later it is in Moscow. · as of '+(new Date().toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"}))+'</p>'}catch(e){t("bmto").innerHTML='<span class="warn">⚠ Moscow Time unavailable — retry later.</span>'}}
async function sup(){try{const h=parseInt(await S([()=>y("https://mempool.space/api/blocks/tip/height",1),()=>y("https://blockstream.info/api/blocks/tip/height",1)]),10);if(!isFinite(h)||h<1)throw 0;const sub=e=>5e9/Math.pow(2,e),era=Math.floor(h/21e4);let mined=0;for(let e=0;e<era;e++)mined+=21e4*sub(e);mined+=(h-era*21e4)*sub(era);let total=0;for(let e=0;e<33;e++)total+=21e4*sub(e);const mb=mined/1e8,tb=total/1e8,left=tb-mb,perDay=sub(era)*144/1e8,infl=perDay*365.25/mb*100;
t("bsuo").innerHTML='<div class="grid"><div class="stat">Mined so far<b>'+v(mb,0)+' BTC</b></div><div class="stat">Of the 21M cap<b>'+(mb/21e6*100).toFixed(2)+'%</b></div><div class="stat">Left to mine<b>'+v(left,0)+' BTC</b></div><div class="stat">Inflation<b>'+infl.toFixed(2)+'% / year</b></div></div><p class="note">About '+v(perDay,2)+' new BTC per day at the current subsidy of '+(sub(era)/1e8)+' BTC per block. Computed from block '+v(h,0)+' — no new bitcoin after ~2140.</p>'}catch(e){t("bsuo").innerHTML='<span class="warn">⚠ Supply data unavailable — retry later.</span>'}}
async function dif(){try{let d=null,dsrc="mempool.space";try{d=await y("https://mempool.space/api/v1/difficulty-adjustment")}catch(e){}if(!(d&&isFinite(d.remainingBlocks))){const h=parseInt(await y("https://blockstream.info/api/blocks/tip/height",1),10);if(!isFinite(h)||h<1)throw 0;const es=h-(h%2016),done=h-es;if(done<1)throw 0;const bh=async hh=>{const hs=await y("https://blockstream.info/api/block-height/"+hh,1);const b=await y("https://blockstream.info/api/block/"+hs);return b.timestamp};const t0=await bh(es),t1=await bh(h),avg=(t1-t0)/done;if(!(avg>0))throw 0;d={remainingBlocks:es+2016-h,estimatedRetargetDate:Date.now()+(es+2016-h)*avg*1e3,difficultyChange:(600/avg-1)*100,progressPercent:done/2016*100,nextRetargetHeight:es+2016};dsrc="blockstream.info"}const dt=new Date(d.estimatedRetargetDate),ch=d.difficultyChange,pct=Math.max(0,Math.min(100,d.progressPercent||0));
t("bdio").innerHTML='<div class="grid"><div class="stat">Blocks to go<b>'+v(d.remainingBlocks,0)+'</b></div><div class="stat">Estimated date<b>'+MO[dt.getMonth()]+' '+dt.getDate()+', '+dt.getFullYear()+'</b></div><div class="stat">Expected change<b style="color:'+(ch>=0?"#f87171":"#4ade80")+'">'+(ch>=0?"+":"")+ch.toFixed(2)+'%</b></div></div><div style="height:12px;background:#0f172a;border-radius:99px;overflow:hidden;margin-top:10px"><div style="height:100%;width:'+pct+'%;background:#fde047"></div></div><p class="note">'+pct.toFixed(1)+'% through this 2,016-block epoch · next adjustment at block '+v(d.nextRetargetHeight,0)+' · '+dsrc+'</p>'}catch(e){t("bdio").innerHTML='<span class="warn">⚠ Difficulty data unavailable — retry later.</span>'}}
async function histP(ms){const rows=await y("https://api.exchange.coinbase.com/products/BTC-USD/candles?start="+new Date(ms-2592e5).toISOString()+"&end="+new Date(ms+2592e5).toISOString()+"&granularity=86400");if(!rows||!rows.length)throw 0;let best=null,bd=1/0;rows.forEach(r=>{const d=Math.abs(1e3*r[0]-ms);if(d<bd){bd=d;best=r[4]}});if(!(best>0))throw 0;return best}
async function cgP(ms){const days=Math.ceil((Date.now()-ms)/864e5);if(days>364)throw 0;const d=await y("https://api.coingecko.com/api/v3/coins/bitcoin/market_chart?vs_currency=usd&days="+(days+1));let best=null,bd=1/0;d.prices.forEach(p=>{const dd=Math.abs(p[0]-ms);if(dd<bd){bd=dd;best=p[1]}});if(!(best>0))throw 0;return best}
async function hour(){const o=t("bhro");if(!o)return;const wage=parseFloat(String(t("bhra").value).replace(/[^0-9.]/g,""));if(!(wage>0)){o.textContent="Enter your hourly wage above zero.";return}o.textContent="Loading…";try{const p=await curP();if(!(p>0))throw 0;const nowS=wage/p*1e8,up=await nowP(),wusd=wage*up/p,ago=async yrs=>{const ms=Date.now()-yrs*365.25*864e5,hp=await S([()=>histP(ms),()=>cgP(ms)]);return wusd/hp*1e8};const s1=await ago(1),s5=await ago(5),s10=await ago(10),cell=(l,x)=>'<div class="stat">'+l+'<b>'+v(Math.round(x),0)+' sats</b></div>';
o.innerHTML='<div class="grid">'+cell("Now",nowS)+cell("1 year ago",s1)+cell("5 years ago",s5)+cell("10 years ago",s10)+'</div><p class="note">One hour at '+mon(wage)+' buys this many sats. Ten years ago an hour bought <b>'+(s10/nowS).toFixed(1)+'×</b> what it buys today. Past years use today\'s exchange rate for the wage. Prices: Coinbase.</p>'}catch(e){o.innerHTML='<span class="warn">⚠ Lookup failed — retry.</span>'}}
t("bhrg").onclick=hour;t("bhra").addEventListener("change",hour);const sel=t("bc");if(sel)sel.addEventListener("change",()=>{PC=null;mt();hour()});mt();sup();dif();hour();setInterval(mt,6e4);setInterval(sup,6e5);setInterval(dif,12e4)})();</script>
