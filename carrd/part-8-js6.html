<script>(()=>{const pa=document.getElementById("bsats");if(!pa)return;const st=document.createElement("style");st.textContent="#bsats .ib{background:#26334d!important;color:#fff!important;border:1px solid #334155!important;border-radius:7px!important;padding:4px 10px!important;font-size:14px!important;font-weight:800!important;line-height:1.2!important;cursor:pointer;touch-action:manipulation;flex:none}#bsats .ip{display:none;background:#0f172a;border:1px solid #26334d;border-radius:8px;padding:10px 12px;margin:8px 0 4px;font-size:14px;line-height:1.55;color:#dbe4f0;white-space:normal}#bsats .ip.on{display:block}";document.head.appendChild(st);
const INFO=[
["#bp","The main calculator. The price at the top is live and refreshes every 30 seconds — or type your own price to run “what if” numbers (tap “Use current price” to switch back). Enter an amount under “You pay” to see how many sats or BTC it buys. You can switch between SAT and BTC and pick from 21 currencies."],
["#bch","Bitcoin's price over time, from the last hour to all of history. The orange line is the 200-week moving average — a long-term trend line. Tap or drag on the chart to inspect any point, switch to Log view to see growth on a compressed scale, or tap Fullscreen for a bigger chart."],
["#bhw","What one bitcoin cost at any past date and time (price data starts in 2015). Look one up, then tap “Use this” to load that price into the calculator and convert money at it."],
["#bda","Simulates buying a fixed amount of bitcoin on a regular schedule — daily, weekly, every two weeks or monthly — from a start date to today. It shows what you would have stacked, what it is worth now, and compares it against putting the same total in as one lump sum on day one."],
["#bno","The state of the Bitcoin network right now: the current block height, the countdown to the next halving (when the new-bitcoin reward cuts in half, roughly every four years), and what it costs to send bitcoin — in sat/vB, and in dollars for a typical transaction."],
["#bgo","A 0–100 gauge of market mood, from Alternative.me, updated daily. Near 0 means investors are fearful (often when prices are beaten down); near 100 means greedy (often after big run-ups). It is a sentiment snapshot, not a buy or sell signal."],
["#bmyo","The Mayer Multiple is the price divided by its 200-day average. Above 1.0, bitcoin is trading above its long-term trend; below 1.0, below it. This card also shows the all-time high price, when it was set, and how far below it the price sits today."],
["#bwi","What $100 would have done if you had bought bitcoin on a past date instead of holding cash — including what inflation quietly did to the cash. The 15y button starts at the earliest price data available (July 2015)."],
["#bga","Set a savings goal in sats or BTC, and enter what you already have. It shows how many sats you still need, what they would cost at today's price, and a progress bar toward your goal."],
["#bfa","Enter how much bitcoin you hold and a hypothetical future price to see what your stack would be worth at that price — and how it compares with what it is worth today."],
["#bmto","How many sats one dollar (or one unit of your chosen currency) buys, shown as a clock. As bitcoin's price rises, Moscow Time runs backwards. Minutes over 59 are normal — it is just the sats number split in two. “Lowest ever” is the reading at bitcoin's all-time high, when a dollar bought the fewest sats in history."],
["#bsuo","How much of bitcoin's fixed 21 million cap has been mined so far, how much is left, and the current inflation rate — the new bitcoin created per day at the current block reward. The supply is computed exactly from the block height."],
["#bdio","Every 2,016 blocks (about two weeks), bitcoin automatically adjusts how hard mining is, to keep blocks coming about every 10 minutes. This card counts down to the next adjustment and estimates the change: positive means blocks were arriving faster than 10 minutes, negative means slower."],
["#bhra","Enter your hourly wage to see how many sats one hour of your work buys — today, and 1, 5 and 10 years ago. A personal way to see bitcoin's rise against your currency's inflation. Past years convert your wage at today's exchange rate."],
["#bbbo","One bitcoin, translated into things people actually buy — ounces of gold and silver, barrels of oil, ribeye steaks, iPhones, groceries, months of rent, even a slice of a house. Gold and silver are priced live; the everyday items use reference prices (labeled with their dates in the footnote), so the counts move with bitcoin's price, not the store's."],
["#breso","New to Bitcoin, or going deeper? The essential reading list: the original white paper, a beginner-friendly explainer, the classic lessons from falling down the rabbit hole, and the deepest archives and guide libraries on the web. All free."],["#bhp","Saving for a house deposit, in bitcoin. Enter the home price and the down payment percentage, say when you want to buy, and pick the bitcoin price to plan around. It shows the down payment, how many sats that takes at that price, and — if you enter a monthly amount — whether your stacking pace gets you there in time, plus the monthly amount that would. The maths assumes bitcoin stays near today's price while you save; treat it as a planning yardstick, not a prediction."]];
const cards=()=>[...pa.querySelectorAll(".card")];
cards().forEach(c=>{const hd=c.querySelector(".hd");if(!hd||hd.querySelector(".ib"))return;let tx=null;for(const[s,x]of INFO)if(c.querySelector(s)){tx=x;break}if(!tx)return;const b=document.createElement("button");b.type="button";b.className="ib";b.textContent="ⓘ";b.title="About this card";b.setAttribute("aria-label","About this card");const pn=document.createElement("div");pn.className="ip";pn.textContent=tx;b.addEventListener("pointerdown",e=>e.stopPropagation());b.addEventListener("mousedown",e=>e.stopPropagation());b.addEventListener("click",e=>{e.preventDefault();e.stopPropagation();pn.classList.toggle("on")});hd.appendChild(b);hd.parentNode.insertBefore(pn,hd.nextSibling)})})();</script>
