<script>(()=>{const pa=document.getElementById("bsats");if(!pa)return;const ok=["bp","bch","bhw","bda","bno","bgo","bmyo","bwi","bga","bfa","bmto","bsuo","bdio","bhra","bbbo","breso","bhp","byt","blk","bln","blu","bep","bml","bfe"];let c=null;try{c=new URLSearchParams(location.search).get("card")}catch(e){}if(!c||ok.indexOf(c)<0)return;const t=document.getElementById(c);if(!t)return;const card=t.closest(".card")||t;let stop=false;const kill=()=>{stop=true};["pointerdown","wheel","touchstart","keydown"].forEach(ev=>addEventListener(ev,kill,{once:true,passive:true}));const flash=()=>{card.classList.add("flash");setTimeout(()=>card.classList.remove("flash"),1300)};const go=s=>{if(stop)return;card.scrollIntoView({behavior:s?"smooth":"auto",block:"start"})};setTimeout(()=>{go(1);flash()},600);setTimeout(()=>go(0),1400);setTimeout(()=>go(0),2300);setTimeout(()=>{go(0);flash()},3400);setTimeout(()=>go(0),4800)})();</script>
