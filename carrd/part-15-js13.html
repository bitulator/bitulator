<script>(()=>{const pa=document.getElementById("bsats");if(!pa)return;const ok=["bp","bch","bhw","bda","bno","bgo","bmyo","bwi","bga","bfa","bmto","bsuo","bdio","bhra","bbbo","breso","bhp","byt"];let c=null;try{c=new URLSearchParams(location.search).get("card")}catch(e){}if(!c||ok.indexOf(c)<0)return;const t=document.getElementById(c);if(!t)return;const card=t.closest(".card")||t;const flash=()=>{card.classList.add("flash");setTimeout(()=>card.classList.remove("flash"),1300)};setTimeout(()=>{card.scrollIntoView({behavior:"smooth",block:"start"});flash()},700);setTimeout(flash,2200)})();</script>
