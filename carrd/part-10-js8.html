<script>
(function(){
function cardOf(id){var t=document.getElementById(id);return t?(t.closest('.card')||t):null}
function go(el){if(!el)return;el.scrollIntoView({behavior:'smooth',block:'start'});el.classList.add('flash');setTimeout(function(){el.classList.remove('flash')},1300)}
var hdr=document.querySelector('#bsats .hdr');
var pa=document.getElementById('bsats'),grid=document.querySelector('#bsats .navgrid');
function syncNav(){if(!grid)return;var btns=[...grid.querySelectorAll('[data-j]')];btns.sort(function(a,b){var ca=cardOf(a.getAttribute('data-j')),cb=cardOf(b.getAttribute('data-j'));if(!ca||!cb)return 0;var pos=ca.compareDocumentPosition(cb);return (pos&Node.DOCUMENT_POSITION_FOLLOWING)?-1:((pos&Node.DOCUMENT_POSITION_PRECEDING)?1:0)});btns.forEach(function(b){grid.appendChild(b)})}
syncNav();
if(pa)new MutationObserver(function(){syncNav()}).observe(pa,{childList:true});
var suppress=false;
document.querySelectorAll('[data-j]').forEach(function(b){b.addEventListener('click',function(){if(suppress)return;go(cardOf(b.getAttribute('data-j')))})});
var st=document.createElement('style');st.textContent='#bsats .navgrid [data-j]{touch-action:none}#bsats .navgrid [data-j].ndrag{opacity:.55;outline:2px dashed #fde047;outline-offset:2px;z-index:5;position:relative}';document.head.appendChild(st);
var IDX={bp:0,bch:1,bhw:2,bda:3,bno:4,bgo:5,bmyo:6,bwi:7,bga:8,bfa:9,bmto:10,bsuo:11,bdio:12,bhra:13,bbbo:14,breso:15,bhp:16,byt:17,blk:18,bln:19,blu:20,bep:21,bml:22,bfe:23};
function applyOrder(ids){
 if(!pa)return;
 var anchor=document.getElementById('brs');
 ids.forEach(function(id){var c=cardOf(id);if(c)pa.insertBefore(c,anchor)});
 try{localStorage.setItem('bmo',ids.map(function(id){return IDX[id]}).filter(function(x){return x!==undefined}).join(','))}catch(e){}
 syncNav();
}
if(grid)grid.querySelectorAll('[data-j]').forEach(function(b){
 b.addEventListener('pointerdown',function(e){
  var sx=e.clientX,sy=e.clientY,started=false,timer=null;
  function start(){if(started)return;started=true;b.classList.add('ndrag')}
  if(e.pointerType==='touch')timer=setTimeout(start,220);
  function mv(ev){
   var dx=ev.clientX-sx,dy=ev.clientY-sy;
   if(!started){if(e.pointerType!=='touch'&&(Math.abs(dx)>9||Math.abs(dy)>9))start();else return}
   ev.preventDefault();
   b.style.transform='translate('+dx+'px,'+dy+'px)';
   var els=[...grid.querySelectorAll('[data-j]')].filter(function(x){return x!==b});
   var next=null;
   for(var i=0;i<els.length;i++){var r=els[i].getBoundingClientRect();var cy=r.top+r.height/2;if(ev.clientY<cy-r.height/2||(ev.clientY<=cy+r.height/2&&ev.clientX<r.left+r.width/2)){next=els[i];break}}
   if(next)grid.insertBefore(b,next);else grid.appendChild(b);
  }
  function up(){
   if(timer)clearTimeout(timer);
   document.removeEventListener('pointermove',mv);document.removeEventListener('pointerup',up);document.removeEventListener('pointercancel',up);
   if(started){b.classList.remove('ndrag');b.style.transform='';suppress=true;applyOrder([...grid.querySelectorAll('[data-j]')].map(function(x){return x.getAttribute('data-j')}));setTimeout(function(){suppress=false},80)}
  }
  document.addEventListener('pointermove',mv);document.addEventListener('pointerup',up);document.addEventListener('pointercancel',up);
 });
});
var bt=document.getElementById('btop');
if(bt)bt.addEventListener('click',function(){go(hdr)});
var up=document.getElementById('jup');if(up)up.addEventListener('click',function(){go(hdr)});
var dn=document.getElementById('jdn');if(dn)dn.addEventListener('click',function(){go(bt)});
})();
</script>
