<script>(()=>{const pa=document.getElementById("bsats");if(!pa)return;const st=document.createElement("style");st.textContent="#bsats .btile{background:#0f172a;border:1px solid #26334d;border-radius:10px;padding:8px 10px;min-width:104px;flex:1 1 104px}#bsats .btile b{color:#fde047;font-size:15px}#bsats .btile span{display:block;color:#94a3b8;font-size:11.5px;margin-top:2px}#bsats .bbar{background:#0f172a;border:1px solid #26334d;border-radius:8px;height:16px;overflow:hidden;margin:10px 0}#bsats .bbar i{display:block;height:100%;background:#f59e0b}";document.head.appendChild(st);const $=id=>document.getElementById(id);const F=(u,t)=>Promise.race([fetch(u).then(r=>{if(!r.ok)throw 0;return r.json()}),new Promise((_,j)=>setTimeout(j,t||20000))]);const MP="https://mempool.space/api",BS="https://blockstream.info/api";const num=n=>Math.round(n).toLocaleString("en-US");const ago=ts=>{const s=Math.max(0,Math.round(Date.now()/1000-ts));if(s<90)return s+"s ago";const m=Math.round(s/60);if(m<90)return m+"m ago";const h=Math.round(m/60);if(h<48)return h+"h ago";return Math.round(h/24)+"d ago"};const price=()=>{const e=$("bp");const v=e?parseFloat(String(e.value).replace(/,/g,"")):0;return v>0?v:0};const usd=sats=>{const p=price();return p?"$"+(sats*p/1e8).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2}):""};const stat=(l,v)=>'<div class="stat">'+l+'<b>'+v+'</b></div>';const grid=inner=>'<div class="grid">'+inner+'</div>';const setShare=(id,txt)=>{const e=$(id);if(e){const c=e.closest(".card");if(c)c.dataset.share=txt}};const tipH=async()=>{try{return await F(MP+"/blocks/tip/height")}catch(e){return await F(BS+"/blocks/tip/height")}};
const blk=async()=>{const el=$("blk");if(!el)return;try{let bs;try{bs=await F(MP+"/v1/blocks")}catch(e){bs=await F(BS+"/blocks")}el.innerHTML='<div class="row" style="flex-wrap:wrap;gap:8px">'+bs.slice(0,8).map(b=>{const pool=b.extras&&b.extras.pool?b.extras.pool.name:"";const fee=b.extras&&isFinite(b.extras.medianFee)?"~"+Math.round(b.extras.medianFee)+" sat/vB":"";return '<div class="btile"><b>'+num(b.height)+'</b><span>'+num(b.tx_count)+' tx · '+(b.size/1048576).toFixed(2)+' MB</span>'+(fee?'<span>'+fee+'</span>':"")+(pool?'<span>'+pool+'</span>':"")+'<span>'+ago(b.timestamp)+'</span></div>'}).join("")+'</div>';const t=bs[0];setShare("blk","Latest block: "+num(t.height)+" · "+num(t.tx_count)+" transactions"+(t.extras&&t.extras.pool?" · mined by "+t.extras.pool.name:"")+".")}catch(e){el.innerHTML='<p class="note">Could not load blocks right now.</p>'}};blk();setInterval(blk,60000);
const bln=async()=>{const el=$("bln");if(!el)return;try{const d=await F(MP+"/v1/lightning/statistics/latest");const L=d.latest,P=d.previous||{};const cap=L.total_capacity/1e8;let rows=stat("Capacity",cap.toLocaleString("en-US",{maximumFractionDigits:2})+" BTC")+stat("Channels",num(L.channel_count))+stat("Nodes",num(L.node_count));if(L.avg_capacity)rows+=stat("Average channel",num(L.avg_capacity)+" sats");el.innerHTML=grid(rows);let chg="";if(P.total_capacity){const pc=(L.total_capacity-P.total_capacity)/P.total_capacity*100;chg=" ("+(pc>=0?"+":"")+pc.toFixed(2)+"% vs yesterday)"}setShare("bln","Lightning Network: "+cap.toLocaleString("en-US",{maximumFractionDigits:0})+" BTC across "+num(L.channel_count)+" channels and "+num(L.node_count)+" nodes"+chg+".")}catch(e){el.innerHTML='<p class="note">Could not load Lightning stats right now.</p>'}};bln();setInterval(bln,300000);
const bnm=async()=>{try{const m=await F(MP+"/mempool");const host=$("bno");if(!host)return;let d=$("bnom");if(!d){d=document.createElement("div");d.id="bnom";host.appendChild(d)}d.innerHTML=grid(stat("Mempool",num(m.count)+" unconfirmed tx")+stat("Backlog",(m.vsize/1e6).toFixed(1)+" vMB · ~"+Math.max(1,Math.round(m.vsize/1e6))+" blocks"))}catch(e){}};bnm();setInterval(bnm,30000);[5000,12000].forEach(t=>setTimeout(()=>{if(!$("bnom"))bnm()},t));
const blu=async()=>{const q=($("bluq").value||"").trim(),out=$("bluo");if(!q){out.innerHTML='<p class="note">Paste an address or a transaction ID first.</p>';return}out.innerHTML='<p class="note">Looking…</p>';const isTx=/^[0-9a-fA-F]{64}$/.test(q);try{if(isTx){const d=await F(MP+"/tx/"+q).catch(()=>F(BS+"/tx/"+q));const tip=await tipH();const vin=d.vin.reduce((a,x)=>a+(x.prevout?x.prevout.value:0),0),vout=d.vout.reduce((a,x)=>a+x.value,0);let rows=stat("Status",d.status.confirmed?"Confirmed":"Unconfirmed — in the mempool");if(d.status.confirmed)rows+=stat("Confirmations",num(tip-d.status.block_height+1))+stat("Block",num(d.status.block_height));rows+=stat("Sent",num(vin)+" sats")+stat("Received",num(vout)+" sats")+stat("Fee",num(d.fee)+" sats · "+(d.fee/Math.max(1,d.weight/4)).toFixed(1)+" sat/vB");out.innerHTML=grid(rows)}else{const d=await F(MP+"/address/"+q).catch(()=>F(BS+"/address/"+q));const cs=d.chain_stats,ms=d.mempool_stats;const bal=cs.funded_txo_sum-cs.spent_txo_sum+ms.funded_txo_sum-ms.spent_txo_sum;let rows=stat("Balance",(bal/1e8).toLocaleString("en-US",{maximumFractionDigits:8})+" BTC")+stat("Balance in sats",num(bal)+" sats");if(usd(bal))rows+=stat("Worth today",usd(bal));rows+=stat("Transactions",num(cs.tx_count+ms.tx_count))+stat("Total received",num(cs.funded_txo_sum+ms.funded_txo_sum)+" sats");out.innerHTML=grid(rows)}}catch(e){out.innerHTML='<p class="note">Nothing found for that '+(isTx?"transaction ID":"address")+" — check it and try again.</p>"}};const bg=$("blug");if(bg)bg.addEventListener("click",blu);
const bep=async()=>{const el=$("bep");if(!el)return;try{const h=await tipH();const ep=Math.floor(h/210000),into=h-ep*210000,pct=into/2100,sub=50/Math.pow(2,ep),left=210000-into;el.innerHTML=grid(stat("Current epoch","Epoch "+ep)+stat("Miner reward",sub+" BTC per block"))+'<div class="bbar"><i style="width:'+pct.toFixed(2)+'%"></i></div>'+grid(stat("Progress",pct.toFixed(2)+"% · "+num(into)+" of 210,000 blocks")+stat("Blocks until the halving",num(left))+stat("Next reward",(sub/2)+" BTC per block"));setShare("bep","Halving epoch "+ep+": "+pct.toFixed(1)+"% complete — "+num(left)+" blocks until the reward drops to "+(sub/2)+" BTC.")}catch(e){el.innerHTML='<p class="note">Could not load the block height right now.</p>'}};bep();setInterval(bep,60000);
const bml=async()=>{const el=$("bml");if(!el)return;try{const h=await tipH();const eta=b=>new Date(Date.now()+b*600000).toLocaleDateString("en-US",{month:"short",year:"numeric"});const findBlock=tgt=>{let mined=0,blk=0,ep=0;while(ep<33){const sub=50/Math.pow(2,ep);const need=Math.ceil((tgt-mined)/sub);if(need<=210000)return blk+need;mined+=210000*sub;blk+=210000;ep++}return blk};const b99=findBlock(20790000),blast=6929999,year=new Date(Date.now()+(blast-h)*600000).getFullYear();el.innerHTML=grid(stat("Block 1,000,000",num(1000000-h)+" blocks · around "+eta(1000000-h))+stat("99% of all bitcoin mined","Block "+num(b99)+" · around "+eta(b99-h))+stat("The last satoshi","Block "+num(blast)+" · around "+year));setShare("bml","Bitcoin milestones: block 1,000,000 around "+eta(1000000-h)+"; 99% of all bitcoin mined around "+eta(b99-h)+"; the last satoshi around "+year+".")}catch(e){el.innerHTML='<p class="note">Could not load the block height right now.</p>'}};bml();setInterval(bml,300000);
const bfe=()=>{const out=$("bfeo");if(!out)return;const vb=parseInt($("bfet").value,10);out.innerHTML='<p class="note">Loading fees…</p>';const render=d=>{const row=(l,r)=>{const sats=r*vb;return stat(l,r+" sat/vB → "+num(sats)+" sats"+(usd(sats)?" ("+usd(sats)+")":""))};out.innerHTML=grid(row("Fast · next block",d.fastestFee)+row("Medium · ~30 min",d.halfHourFee)+row("Slow · ~1 hour",d.hourFee))};F(MP+"/v1/fees/recommended").then(render).catch(()=>{F(BS+"/fee-estimates").then(e2=>{const g=k=>Math.max(1,Math.round(e2[k]||e2["1"]||1));render({fastestFee:g("1"),halfHourFee:g("3"),hourFee:g("6")})}).catch(()=>{out.innerHTML='<p class="note">Could not load fee rates right now.</p>'})})};const fg=$("bfeg");if(fg)fg.addEventListener("click",bfe);const fs=$("bfet");if(fs)fs.addEventListener("change",bfe);bfe()})();</script>
