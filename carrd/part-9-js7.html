<script>(()=>{const t=e=>document.getElementById(e),v=(n,d)=>isFinite(n)?n.toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d}):"—";
async function y(u){const c=new AbortController(),to=setTimeout(()=>c.abort(),12e3);try{const r=await fetch(u,{signal:c.signal});if(!r.ok)throw 0;return await r.json()}finally{clearTimeout(to)}}const S=fs=>fs.reduce((p,f)=>p.catch(f),Promise.reject(0));
const nowP=()=>S([()=>y("https://api.coinbase.com/v2/prices/BTC-USD/spot").then(d=>{const p=parseFloat(d.data.amount);if(!(p>0))throw 0;return p}),()=>y("https://mempool.space/api/v1/prices").then(d=>{if(!(d.USD>0))throw 0;return d.USD}),()=>y("https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=usd").then(d=>d.bitcoin.usd)]);
const REF=[["Crude oil (WTI), barrels",89.62,0],["Ribeye steaks (1 lb each)",16,0],["iPhone 17 phones",799,0],["Eggs, dozen",2.32,0],["Gasoline, gallons",4.09,0],["Milk, gallons",4.10,0],["Median US rent, months",1413,0],["Average new car (AAA)",39376,2]];
async function buys(){try{const btc=await nowP();if(!(btc>0))throw 0;let gold=3850,silver=47.8,live=0;try{const d=await y("https://api.coingecko.com/api/v3/simple/price?ids=pax-gold,kinesis-silver&vs_currencies=usd");if(d["pax-gold"]&&d["pax-gold"].usd>0){gold=d["pax-gold"].usd;live=1}if(d["kinesis-silver"]&&d["kinesis-silver"].usd>0)silver=d["kinesis-silver"].usd}catch(e){}
const cell=(l,x,u,d)=>'<div class="stat">'+l+'<b>'+v(x,d)+' '+u+'</b></div>';let h='<div class="grid">'+cell("Gold, troy oz",btc/gold,"oz",1)+cell("Silver, troy oz",btc/silver,"oz",0);REF.forEach(r=>{h+=cell(r[0],btc/r[1],"",r[2])});h+=cell("Median US home",btc/410700*100,"% of one",1);h+='</div><p class="note">One bitcoin at '+("$"+v(btc,2))+' buys all this. '+(live?"Gold and silver priced live via CoinGecko (the PAX Gold and Kinesis Silver tokens track the spot price). ":"Live metals feed unavailable — gold and silver shown at reference prices. ")+'Everything else uses reference prices as of Nov 2026 (oil: FRED WTI $89.62/bbl, Nov 11; eggs and milk: BLS Oct 2026; rent and home: US Census; car: AAA 2026) — those counts move with bitcoin\'s price, not the store\'s.</p>';t("bbbo").innerHTML=h}catch(e){t("bbbo").innerHTML='<span class="warn">⚠ Purchasing-power data unavailable — retry later.</span>'}}
buys();setInterval(buys,12e4)})();</script>
