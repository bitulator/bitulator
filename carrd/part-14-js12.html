<script>(()=>{const pa=document.getElementById("bsats");if(!pa)return;const $=i=>document.getElementById(i);const fmt=n=>Math.round(n).toLocaleString("en-US");const stat=(root,label)=>{if(!root)return null;const ss=root.querySelectorAll(".stat");for(const x of ss)if(x.textContent.indexOf(label)===0)return x.querySelector("b");return null};const mir=()=>{const cp=$("bcp");if(cp){const tx=cp.textContent.replace("Current price:","").trim();if(tx&&!/Loading/.test(tx)){$("bglp").textContent=tx;document.title=tx+" · Bitulator"}}const mb=stat(document.getElementById("bmto"),"Sats per");if(mb){const st=mb.closest(".stat");const lab=st.textContent.replace(mb.textContent,"").replace("Sats per","").trim();if(lab)$("bgls").textContent=lab+" = "+mb.textContent+" sats"}const hb=stat(document.getElementById("bno"),"Estimated time left");if(hb){const m=hb.textContent.match(/[\d,]+/);if(m)$("bglh").textContent="~"+m[0]+"d"}const dio=document.getElementById("bdio");const db=stat(dio,"Estimated date");if(db){const dt=new Date(db.textContent.trim());if(isFinite(dt))$("bgldf").textContent="~"+Math.max(0,Math.round((dt-new Date())/864e5))+"d"}const cb=stat(dio,"Expected change");if(cb){const v=parseFloat(cb.textContent);if(isFinite(v)){const el=$("bgldc");el.textContent=(v>=0?"▲ +":"▼ ")+v.toFixed(2)+"% "+(v>=0?"harder":"easier");el.style.color=v>=0?"#f87171":"#4ade80"}}const ab=stat(document.getElementById("bmyo"),"All-time high");if(ab)$("bgla").textContent=ab.textContent};const net=async()=>{for(const u of["https://mempool.space/api/blocks/tip/height","https://blockstream.info/api/blocks/tip/height"]){try{const h=parseInt(await(await fetch(u)).text(),10);if(isFinite(h)&&h>0){$("bglb").textContent=fmt(h);break}}catch(e){}}try{const f=await(await fetch("https://mempool.space/api/v1/fees/recommended")).json();if(f&&isFinite(f.fastestFee))$("bglf").textContent=f.fastestFee}catch(e){}try{const m=await(await fetch("https://mempool.space/api/mempool")).json();if(m&&isFinite(m.count))$("bglm").textContent=Number(m.count).toLocaleString("en-US")}catch(e){}};const chg=async()=>{try{const j=await(await fetch("https://api.exchange.coinbase.com/products/BTC-USD/stats")).json();const o=parseFloat(j.open),l=parseFloat(j.last);if(isFinite(o)&&isFinite(l)&&o>0){const p=(l-o)/o*100;const el=$("bglc");el.textContent=(p>=0?"+":"")+p.toFixed(2)+"% 24h";el.style.color=p>=0?"#4ade80":"#f87171"}}catch(e){}};const athD=async()=>{try{const j=await(await fetch("https://api.coingecko.com/api/v3/coins/bitcoin?localization=false&tickers=false&market_data=true&community_data=false&developer_data=false&sparkline=false")).json();const d=j&&j.market_data&&j.market_data.ath_date&&j.market_data.ath_date.usd;if(d){const days=Math.max(0,Math.round((Date.now()-new Date(d).getTime())/864e5));$("bgld").textContent="("+days+"d ago)"}}catch(e){}};mir();net();chg();athD();setInterval(mir,5000);setInterval(()=>{net();chg()},60000);setInterval(athD,1800000)})();</script>
